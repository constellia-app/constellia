name: constellia
description: "Recognises the constellations in a photo of the night sky and names every star."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/icone.png
  web:
    generate: true
    image_path: assets/images/icone.png
    background_color: "#070B1A"
    theme_color: "#070B1A"
